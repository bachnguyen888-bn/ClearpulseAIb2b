<footer class="site-footer">
  <div class="container footer-inner">
    <p class="footer-brand"><span class="wordmark">{{brandName}}</span> — after-hours Instagram replies for med spas</p>
    <p class="footer-meta">{{ownerName}} · {{city}} · Serving {{serviceArea}}</p>
    <ul class="footer-links" aria-label="Contact">
      <li><a href="{{mailtoUrl}}">Email</a></li>
      <li><a href="{{telUrl}}">{{phoneDisplay}}</a></li>
      <li><a href="{{instagramProfileUrl}}">@{{handle}}</a></li>
      <li><a href="privacy.html">Privacy</a></li>
    </ul>
    <p class="footer-note">Replies are drafted automatically and sent only after the spa’s team approves them.</p>
    <p class="footer-copy">© {{year}} {{brandName}}</p>
  </div>
</footer>
